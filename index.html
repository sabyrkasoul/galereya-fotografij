<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея фотографий</title>
    <link rel="stylesheet" href="./css/style.css">
  </head>
  <body>
    <section class="gallery container">
      <header class="gallery__header">
        <h1 class="gallery__title">Галерея</h1>
        <button class="gallery__button" type="button">Загрузить</button>
      </header>
      <div class="gallery__grid">
        <article class="card">
          <img
            class="card__image"
            src="./img/lake.jpg"
            alt="Горное озеро"
            width="384" height="288"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a class="card__link" href="/">
                Горное озеро
              </a>
            </h2>
            <time class="card__date" datetime="2026-06-12">12 Июня 2026</time>
          </div>
        </article>
        <article class="card">
          <img
            class="card__image"
            src="./img/night-city.jpg"
            alt="Ночной город"
            width="384" height="288"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a class="card__link" href="/">
                Ночной город
              </a>
            </h2>
            <time class="card__date" datetime="2026-06-10">10 Июня 2026</time>
          </div>
        </article>
        <article class="card">
          <img
            class="card__image"
            src="./img/ocean.jpg"
            alt="Океанский пляж"
            width="384" height="288"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a class="card__link" href="/">
                Океанский пляж
              </a>
            </h2>
            <time class="card__date" datetime="2026-06-08">8 Июня 2026</time>
          </div>
        </article>
        <article class="card">
          <img
            class="card__image"
            src="./img/forest.jpg"
            alt="Лесная тропа"
            width="384" height="288"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a class="card__link" href="/">
                Лесная тропа
              </a>
            </h2>
            <time class="card__date" datetime="2026-06-06">6 Июня 2026</time>
          </div>
        </article>
        <article class="card">
          <img
            class="card__image"
            src="./img/waterfall.jpg"
            alt="Водопад"
            width="384" height="288"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a class="card__link" href="/">
                Водопад
              </a>
            </h2>
            <time class="card__date" datetime="2026-06-04">4 Июня 2026</time>
          </div>
        </article>
        <article class="card">
          <img
            class="card__image"
            src="./img/city-streets.jpg"
            alt="Городские улицы"
            width="384" height="288"
          >
          <div class="card__body">
            <h2 class="card__title">
              <a class="card__link" href="/">
                Городские улицы
              </a>
            </h2>
            <time class="card__date" datetime="2026-06-02">2 Июня 2026</time>
          </div>
        </article>
      </div>
    </section>
    n>
  </body>
</html>
